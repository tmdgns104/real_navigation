<!DOCTYPE html>
<html lang="ko">
<head>
  <title>Navigation Map</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      color: #243447;
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #123047;
      color: white;
      flex-wrap: wrap;
    }

    label {
      font-size: 14px;
      font-weight: 700;
    }

    select {
      border: 0;
      border-radius: 6px;
      padding: 8px 10px;
      background: white;
      color: #243447;
      font-weight: 700;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 8px 12px;
      background: #eaf5ff;
      color: #0f4c81;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #eef2f6;
      color: #243447;
    }

    #mode-status {
      margin-left: auto;
      font-size: 13px;
      color: #d7e6f5;
    }

    #map {
      height: calc(100vh - 150px);
      width: 100%;
    }

    #info-panel {
      display: flex;
      justify-content: center;
      gap: 18px;
      min-height: 78px;
      padding: 10px 20px;
      border-top: 1px solid #d7dee8;
      background: #f7f9fc;
      box-sizing: border-box;
    }

    .info-card {
      min-width: 210px;
      line-height: 1.7;
      font-size: 14px;
    }

    .info-card strong {
      display: inline-block;
      width: 72px;
      color: #5c6d7e;
    }

    .pass {
      color: #1e7145;
      font-weight: 800;
    }

    .fail {
      color: #c0392b;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <label for="drive-mode">모드</label>
    <select id="drive-mode">
      <option value="replay" selected>테스트 주행</option>
      <option value="live">실시간 검증</option>
    </select>
    <button onclick="startBackend()">주행 시작</button>
    <button onclick="stopBackend()">주행 종료</button>
    <button class="secondary" onclick="currentLoopOnOff(false)">화면 일시정지</button>
    <button class="secondary" onclick="currentLoopOnOff(true)">화면 다시 시작</button>
    <button id="save-btn">리포트 저장</button>
    <span id="mode-status">대기 중</span>
  </div>

  <div id="map"></div>

  <div id="info-panel">
    <div class="info-card">
      <div><strong>시간</strong><span id="info-time">-</span></div>
      <div><strong>위도</strong><span id="info-lat">-</span></div>
      <div><strong>경도</strong><span id="info-lon">-</span></div>
    </div>
    <div class="info-card">
      <div><strong>속도</strong><span id="info-speed">-</span></div>
      <div><strong>방향</strong><span id="info-heading">-</span></div>
    </div>
    <div class="info-card">
      <div><strong>결과</strong><span id="info-result">-</span></div>
      <div><strong>사유</strong><span id="info-reason">-</span></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/js/map.js"></script>
</body>
</html>
